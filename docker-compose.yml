services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotoner-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - autotoner-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotoner-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - autotoner-net

networks:
  autotoner-net:
    driver: bridge